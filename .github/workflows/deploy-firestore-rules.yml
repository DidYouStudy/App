# Co-authored-by: Claude Sonnet 5.5
name: Deploy Firestore rules

# Manual only: a team member starts this from the Actions tab.
# It deploys firestore.rules from the selected ref and nothing else.
on:
  workflow_dispatch:

# Never run two deployments at once, and never cancel one halfway through.
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

# The job only needs to read the repository.
permissions:
  contents: read

jobs:
  deploy-rules:
    name: Deploy firestore.rules
    runs-on: ubuntu-latest
    env:
      # Repository secret: full JSON of a service account allowed to deploy rules
      # (role "Firebase Rules Admin"). Written to a temp file below.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Repository secret: the Firebase project ID to deploy to.
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail early with a clear message instead of a cryptic CLI error.
      - name: Check required secrets
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::FIREBASE_PROJECT_ID secret is not set"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Same pinned version as ci.yml. --ignore-scripts: no dependency lifecycle scripts run.
      - name: Install Firebase CLI
        run: npm install -g --ignore-scripts firebase-tools@15.31.0

      # The CLI reads the service account through GOOGLE_APPLICATION_CREDENTIALS.
      # The file lives in the runner temp dir, outside the checkout, and is removed afterwards.
      - name: Deploy Firestore rules
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          trap 'rm -f "$credentials"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" \
            firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
